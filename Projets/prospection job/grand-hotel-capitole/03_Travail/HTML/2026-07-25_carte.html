<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte de Visite Digitale - Julien FLORENCE</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #07090E;
            --card-bg: #0F1115;
            --accent: #D4AF37;
            --accent-glow: #F7EF8A;
            --text: #FFFFFF;
            --text-dim: #A0A4B0;
        }

        body { 
            background-color: var(--bg); 
            color: var(--text); 
            font-family: 'Montserrat', sans-serif; 
            margin: 0;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Ambient background */
        .ambient {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background:
              radial-gradient(60vw 60vw at 15% 15%, rgba(212, 175, 55, 0.1), transparent 70%),
              radial-gradient(60vw 60vw at 85% 85%, rgba(197, 160, 89, 0.08), transparent 70%),
              linear-gradient(145deg, #07090E 0%, #050609 100%);
        }

        .card-container { 
            background: var(--card-bg); 
            border: 2px solid var(--accent); 
            border-radius: 24px; 
            padding: 35px 25px; 
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            max-width: 380px;
            width: 100%;
            position: relative;
            z-index: 2;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(212, 175, 55, 0.35);
        }

        .profile-pic {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            margin: 0 auto 20px auto;
            object-fit: cover;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
            display: block;
        }

        h1 { 
            font-family: 'Cinzel', serif;
            letter-spacing: 3px; 
            text-transform: uppercase; 
            margin: 0 0 8px 0;
            font-size: 1.4rem;
            color: var(--text);
        }

        .subtitle {
            font-size: 0.72rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 25px;
            font-weight: 700;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 10px;
        }

        .qr-box { 
            background: white; 
            padding: 12px; 
            border-radius: 16px; 
            display: inline-block; 
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .qr-box img {
            width: 220px;
            height: 220px;
            display: block;
            object-fit: contain;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn { 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: rgba(212, 175, 55, 0.08); 
            border: 1px solid rgba(212, 175, 55, 0.4);
            color: var(--accent); 
            padding: 12px; 
            text-decoration: none; 
            border-radius: 10px; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            cursor: pointer; 
            font-size: 0.68rem;
            font-family: 'Cinzel', serif;
            transition: all 0.3s ease;
        }

        .btn:hover { 
            background: var(--accent); 
            color: #000; 
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.4);
            transform: translateY(-2px);
        }

        .btn-full {
            grid-column: span 2;
            background: linear-gradient(135deg, var(--accent-glow) 0%, var(--accent) 50%, #8A6426 100%);
            color: #000;
            border: none;
            font-weight: 800;
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }

        .btn-full:hover {
            background: #FFFFFF;
            color: #000;
            box-shadow: 0 6px 18px rgba(255, 255, 255, 0.4);
        }

        .footer-text {
            margin-top: 15px;
            font-size: 0.65rem;
            opacity: 0.6;
            color: var(--text-dim);
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="ambient" aria-hidden="true"></div>

<div class="card-container">
    <img class="profile-pic" src="photo/photo_moi_pro.jpeg" alt="Photo de Julien Florence">
    
    <h1>Julien FLORENCE</h1>
    <div class="subtitle">Responsable Commercial & Événementiel</div>
    
    <div class="qr-box">
        <img src="qr-code.png" alt="QR Code CV Interactif">
    </div>

    <div class="btn-grid">
        <a href="tel:0661747573" class="btn">📞 Appeler</a>
        <a href="mailto:julienflorence.florence@gmail.com" class="btn">✉️ Écrire</a>
        <a href="https://julienflorenceflorence-oss.github.io/cv-prestige/" target="_blank" class="btn btn-full">🌐 Ouvrir le CV Interactif</a>
        <a href="https://calendar.app.google/iCzfE1GQrjxM3ZQ56" target="_blank" class="btn btn-full" style="background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.2); color: #fff;">📅 Réserver un RDV</a>
    </div>
    
    <div class="footer-text">Scannez pour accéder à mon dossier de prestige</div>
</div>

</body>
</html>
