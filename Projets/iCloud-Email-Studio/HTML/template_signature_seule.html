<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template Signature — Julien FLORENCE (avec Bannière Cerveau)</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0d1117;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            color: #ffffff;
        }
        .signature-box {
            background: #000;
            border: 1px solid #D4AF37;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .btn-copy {
            background: #D4AF37;
            color: #000;
            border: none;
            padding: 14px 28px;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            border-radius: 4px;
        }
        .btn-copy:hover {
            background: #ffffff;
        }
    </style>
</head>
<body>

    <h2 style="font-family: 'Cinzel', serif; color: #D4AF37; margin-bottom: 20px;">Template Signature — Julien FLORENCE</h2>

    <div class="signature-box" id="signature-block">
        <table cellpadding="0" cellspacing="0" border="0" width="600" style="background-color: #0F1115; width: 600px; font-family: 'Montserrat', Arial, sans-serif; border: 1px solid #D4AF37; border-collapse: collapse;">
            <!-- 1. BANNIÈRE CERVEAU (EN-TÊTE) -->
            <tr>
                <td style="padding: 0; line-height: 0; background-color: #000; width: 600px;">
                    <img src="cerveau_42.gif" onerror="this.onerror=null; this.src='https://raw.githubusercontent.com/julienflorenceflorence-oss.github.io/cv-prestige/video/cerveau_42.gif';" width="600" alt="Cerveau IA" style="display: block; width: 600px; height: auto; border: 0;">
                </td>
            </tr>
            <tr><td height="3" style="background-color: #D4AF37; line-height: 3px; font-size: 3px;">&nbsp;</td></tr>

            <!-- 2. BLOC COORDONNÉES & BOUTONS -->
            <tr>
                <td style="padding: 25px 20px; background-color: #0F1115;">
                    <table cellpadding="0" cellspacing="0" border="0" width="100%">
                        <tr>
                            <td width="100" align="center" style="vertical-align: top;">
                                <div style="width: 90px; height: 90px; border: 2px solid #D4AF37; border-radius: 50%; overflow: hidden; background-color: #000;">
                                    <img src="https://julienflorenceflorence-oss.github.io/cv-prestige/photo/photo%20moi%20pro.jpeg" alt="Julien FLORENCE" width="90" style="display: block;">
                                </div>
                            </td>
                            <td style="padding-left: 18px; vertical-align: middle;">
                                <div style="color: #D4AF37; font-size: 20px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; font-family: 'Cinzel', serif;">Julien FLORENCE</div>
                                <div style="line-height: 8px; font-size: 1px;">&nbsp;</div>
                                <div style="color: #ffffff; font-size: 12px; font-weight: 300; text-transform: uppercase; letter-spacing: 1.2px; opacity: 0.9;">Expert en Stratégie, Développement & Coaching</div>
                                
                                <table cellpadding="0" cellspacing="0" border="0" style="margin-top: 14px;">
                                    <tr>
                                        <td style="vertical-align: middle;">
                                            <img src="https://img.icons8.com/ios-filled/50/D4AF37/phone.png" width="12" style="display: block; width: 12px; border:0;">
                                        </td>
                                        <td style="padding-left: 6px; color: #D4AF37; font-size: 12px; font-weight: bold; letter-spacing: 0.5px; white-space: nowrap;">
                                            <a href="tel:0661747573" style="color: #D4AF37; text-decoration: none;">06 61 74 75 73</a>
                                        </td>
                                        <td style="padding: 0 8px; color: rgba(212,175,55,0.3);">|</td>
                                        <td style="vertical-align: middle;">
                                            <img src="https://img.icons8.com/ios-filled/50/D4AF37/new-post.png" width="12" style="display: block; width: 12px; border:0;">
                                        </td>
                                        <td style="padding-left: 6px; color: #ffffff; font-size: 12px; opacity: 0.8; letter-spacing: 0.5px;">
                                            <a href="mailto:julien.florence@gmail.com" style="color: #ffffff; text-decoration: none;">julien.florence@gmail.com</a>
                                        </td>
                                    </tr>
                                </table>

                                <div style="margin-top: 18px; font-family: 'Cinzel', serif;">
                                    <a href="https://calendar.app.google/iCzfE1GQrjxM3ZQ56" target="_blank" style="display: inline-block; background-color: #D4AF37; color: #000000 !important; padding: 8px 14px; text-decoration: none; font-size: 10px; font-weight: bold; border-radius: 4px; text-transform: uppercase; letter-spacing: 1px; border: 1px solid #D4AF37; margin-right: 6px;">Prendre RDV</a>
                                    <a href="https://julienflorenceflorence-oss.github.io/cv-prestige/" target="_blank" style="display: inline-block; background-color: #0F1115; color: #D4AF37 !important; padding: 8px 14px; text-decoration: none; font-size: 10px; font-weight: bold; border-radius: 4px; text-transform: uppercase; letter-spacing: 1px; border: 1px solid #D4AF37; margin-right: 6px;">CV Interactif</a>
                                    <a href="https://www.linkedin.com/in/julien-florence-2536a083/" target="_blank" style="display: inline-block; background-color: #0F1115; color: #D4AF37 !important; padding: 8px 14px; text-decoration: none; font-size: 10px; font-weight: bold; border-radius: 4px; text-transform: uppercase; letter-spacing: 1px; border: 1px solid #D4AF37;">LinkedIn</a>
                                </div>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </div>

    <button class="btn-copy" onclick="copySignature()">Copier la Signature dans le presse-papier</button>
    <div id="status" style="margin-top:10px; color:#D4AF37; font-weight:bold;"></div>

    <script>
        function copySignature() {
            const container = document.getElementById('signature-block');
            const range = document.createRange();
            range.selectNode(container);
            window.getSelection().removeAllRanges();
            window.getSelection().addRange(range);
            document.execCommand('copy');
            document.getElementById('status').innerText = "✓ Signature copiée avec la bannière cerveau !";
            setTimeout(() => document.getElementById('status').innerText = "", 3500);
        }
    </script>
</body>
</html>
