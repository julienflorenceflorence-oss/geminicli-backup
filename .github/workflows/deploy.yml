name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Ultra-Fast Public Site
        run: |
          mkdir -p _site
          cp *.html _site/ 2>/dev/null || true
          cp *.vcf _site/ 2>/dev/null || true
          cp *.pdf _site/ 2>/dev/null || true
          cp *.png _site/ 2>/dev/null || true
          cp *.jpg _site/ 2>/dev/null || true
          cp *.gif _site/ 2>/dev/null || true
          cp *.mp4 _site/ 2>/dev/null || true
          cp .nojekyll _site/ 2>/dev/null || true
          cp -r diplomes_images _site/ 2>/dev/null || true
          cp -r 04_Livrables _site/ 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
